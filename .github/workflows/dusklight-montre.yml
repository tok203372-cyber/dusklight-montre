      - name: Installer les outils (ninja, Java 17)
        shell: bash
        run: sudo apt-get update && sudo apt-get -y install ninja-build

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Installer le NDK Android
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0" "ndk;${ANDROID_NDK_VERSION}"

      - name: Installer Rust pour ARM 32 bits
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add armv7-linux-androideabi

      - name: Cache de compilation (sccache)
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configurer la compilation (CMake, armeabi-v7a)
        shell: bash
        working-directory: dusklight
        run: |
          set -euo pipefail
          cmake -S . -B build/android-arm -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS_RELWITHDEBINFO="-O2 -DNDEBUG" \
            -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O2 -DNDEBUG" \
            -DCMAKE_INSTALL_PREFIX="$PWD/build/install" \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_zstd=ON \
            -DBOREALIS_ENABLE_SENTRY=OFF \
            -DRust_CARGO_TARGET=armv7-linux-androideabi \
            -DRust_RUSTUP_INSTALL_MISSING_TARGET=ON \
            -DDUSK_ENABLE_CODE_MODS=OFF \
            -DDUSK_MONTRE=ON \
            -DAURORA_DAWN_PROVIDER=vendor \
            -DFETCHCONTENT_SOURCE_DIR_DAWN="$GITHUB_WORKSPACE/dawn" \
            -DDAWN_BUILD_PROTOBUF=OFF \
            -DTINT_BUILD_IR_BINARY=OFF \
            2>&1 | tee "$RUNNER_TEMP/configuration.log"

      - name: Compiler le jeu (long, environ 1 à 2 heures)
        shell: bash
        working-directory: dusklight
        run: |
          set -euo pipefail
          cmake --build build/android-arm --target dusklight -- -k 0 2>&1 | tee "$RUNNER_TEMP/compilation.log"

      - name: Vérifier la bibliothèque (32 bits ARM)
        shell: bash
        working-directory: dusklight
        run: |
          set -euo pipefail
          file build/android-arm/libmain.so
          file build/android-arm/libmain.so | grep -q "ELF 32-bit LSB shared object, ARM"
          ls -lh build/android-arm/libmain.so

      - name: Fabriquer l'APK (Gradle)
        shell: bash
        working-directory: dusklight/platforms/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug -PandroidStageStrip=0 --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Préparer le téléchargement
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload
          cp dusklight/platforms/android/app/build/outputs/apk/debug/*armeabi-v7a*.apk upload/DusklightMontre.apk
          ls -lh upload

      - name: Envoyer l'APK
        uses: actions/upload-artifact@v7
        with:
          name: DusklightMontre-apk
          path: upload/
          compression-level: 0

      - name: En cas d'erreur, garder les journaux
        if: failure()
        shell: bash
        run: |
          mkdir -p journaux
          cp "$RUNNER_TEMP"/*.log journaux/ 2>/dev/null || true
          for f in journaux/*.log; do
            echo "=== $f : premières erreurs ==="
            grep -n -m 40 -E "error:|Error |FAILED|CMake Error|What went wrong" "$f" || true
          done

      - name: Envoyer les journaux d'erreur
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: journaux-erreur
          path: journaux/
