# Dusklight Montre : fabrique l'APK 32 bits (armeabi-v7a) de Dusklight pour une montre Wear OS.
#
# Dusklight est le portage PC/Android de Twilight Princess fait par la communauté (code CC0) :
# https://github.com/TwilitRealm/dusklight
# Ce fichier télécharge ce code, lui applique les modifications « montre » (contenues plus bas,
# dans MONTRE_KIT), puis compile tout dans le cloud de GitHub. Aucun jeu n'est inclus :
# il faudra copier sur la montre ton propre disque de Twilight Princess.
#
# Lancement : à chaque envoi (commit) de ce fichier, ou bouton « Run workflow » dans l'onglet Actions.
# Résultat : dans l'onglet Actions > la compilation terminée > « Artifacts » > DusklightMontre-apk.

name: Compiler Dusklight Montre

on:
  workflow_dispatch:
  push:

concurrency:
  group: dusklight-montre
  cancel-in-progress: true

env:
  # Version de Dusklight pour laquelle les modifications « montre » ont été écrites
  DUSKLIGHT_COMMIT: "77705f8bb95ef7b7dca4675b149c4bcb6a48da34"
  # Version de Dawn (moteur graphique WebGPU) utilisée par cette version de Dusklight
  DAWN_COMMIT: "1155e0ed531126f33a1279afa029349651ca1c93"
  ANDROID_NDK_VERSION: "29.0.14206865"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  apk:
    name: APK montre (32 bits)
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Faire de la place sur le disque
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules || true
          df -h /

      - name: Télécharger Dusklight (code source)
        uses: actions/checkout@v6
        with:
          repository: TwilitRealm/dusklight
          ref: ${{ env.DUSKLIGHT_COMMIT }}
          fetch-depth: 0
          path: dusklight

      - name: Télécharger aurora et borealis (sous-modules)
        shell: bash
        working-directory: dusklight
        run: git submodule update --init extern/aurora extern/borealis

      - name: Télécharger Dawn (moteur graphique, à corriger pour le 32 bits)
        shell: bash
        run: |
          set -euo pipefail
          grep -q "$DAWN_COMMIT" dusklight/extern/aurora/cmake/AuroraDependencyVersions.cmake \
            || echo "::warning::DAWN_COMMIT ne correspond pas à la version attendue par Dusklight"
          git init -q dawn
          git -C dawn remote add origin https://github.com/encounter/dawn.git
          git -C dawn fetch -q --depth 1 origin "$DAWN_COMMIT"
          git -C dawn checkout -q FETCH_HEAD
          git -C dawn log -1 --format='Dawn %h %cd'

      - name: Appliquer les modifications pour la montre
        shell: bash
        working-directory: dusklight
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kit"
